<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - Administracion</title>

  <!-- Bootstrap: se usa solo para la grilla de columnas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Hoja de estilos propia. Va despues de Bootstrap para poder cambiarlo -->
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

  <!-- ================= PANEL DEL ADMINISTRADOR ================= -->
  <div id="admin-contenedor">

    <!-- Menu lateral -->
    <aside id="menu-admin">
      <a id="logo-admin" href="index.html">BOL STORE</a>
      <p class="rol-caja">Conectado como <strong id="rol-actual">Administrador</strong></p>

      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="productos.html" class="activo">Productos</a></li>
          <li class="solo-admin"><a href="nuevo-producto.html">Nuevo producto</a></li>
          <li class="solo-admin"><a href="usuarios.html">Usuarios</a></li>
          <li class="solo-admin"><a href="nuevo-usuario.html">Nuevo usuario</a></li>
        </ul>
      </nav>

      <div class="menu-admin-pie">
        <label for="selector-rol">Probar como:</label>
        <select id="selector-rol" onchange="cambiarRol()">
          <option value="Administrador">Administrador</option>
          <option value="Vendedor">Vendedor</option>
        </select>
        <a href="../index.html">Volver a la tienda</a>
      </div>
    </aside>

    <!-- Contenido -->
    <main id="contenido-admin">
      <h1>Productos</h1>
      <p>Listado de todos los productos de la tienda.</p>

      <p class="solo-admin">
        <a class="boton" href="nuevo-producto.html">Nuevo producto</a>
      </p>

      <section class="panel">
        <div id="tabla-productos"></div>
      </section>
    </main>

  </div>

  <script src="../js/productos.js"></script>
  <script src="../js/usuarios.js"></script>
  <script src="../js/regiones.js"></script>
  <script src="../js/validaciones.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
