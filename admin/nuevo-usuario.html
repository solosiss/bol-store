<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo usuario - Administracion</title>

  <!-- Bootstrap: se usa solo para la grilla de columnas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Hoja de estilos propia. Va despues de Bootstrap para poder cambiarlo -->
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

  <!-- ================= PANEL DEL ADMINISTRADOR ================= -->
  <div id="admin-contenedor">

    <!-- Menu lateral -->
    <aside id="menu-admin">
      <a id="logo-admin" href="index.html">BOL STORE</a>
      <p class="rol-caja">Conectado como <strong id="rol-actual">Administrador</strong></p>

      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="productos.html">Productos</a></li>
          <li class="solo-admin"><a href="nuevo-producto.html">Nuevo producto</a></li>
          <li class="solo-admin"><a href="usuarios.html">Usuarios</a></li>
          <li class="solo-admin"><a href="nuevo-usuario.html" class="activo">Nuevo usuario</a></li>
        </ul>
      </nav>

      <div class="menu-admin-pie">
        <label for="selector-rol">Probar como:</label>
        <select id="selector-rol" onchange="cambiarRol()">
          <option value="Administrador">Administrador</option>
          <option value="Vendedor">Vendedor</option>
        </select>
        <a href="../index.html">Volver a la tienda</a>
      </div>
    </aside>

    <!-- Contenido -->
    <main id="contenido-admin">
      <h1>Nuevo usuario</h1>

      <section class="panel">
        <form onsubmit="return validarFormularioUsuario()" novalidate>

          <div class="row">
            <div class="col-md-4">
              <div class="campo">
                <label for="run">RUN *</label>
                <input type="text" id="run" name="run" maxlength="9"
                       placeholder="190110222" onblur="validarRun()">
                <span class="ayuda">Sin puntos ni guion.</span>
                <span id="error-run"></span>
              </div>
            </div>

            <div class="col-md-4">
              <div class="campo">
                <label for="nombre">Nombre *</label>
                <input type="text" id="nombre" name="nombre" maxlength="50"
                       onblur="validarNombre()">
                <span id="error-nombre"></span>
              </div>
            </div>

            <div class="col-md-4">
              <div class="campo">
                <label for="apellidos">Apellidos *</label>
                <input type="text" id="apellidos" name="apellidos" maxlength="100"
                       onblur="validarApellidos()">
                <span id="error-apellidos"></span>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="campo">
                <label for="correo">Correo *</label>
                <input type="email" id="correo" name="correo" maxlength="100"
                       list="dominios" onblur="validarCorreoRegistro()">
                <datalist id="dominios">
                  <option value="@duoc.cl">
                  <option value="@profesor.duoc.cl">
                  <option value="@gmail.com">
                </datalist>
                <span class="ayuda">Solo @duoc.cl, @profesor.duoc.cl y @gmail.com</span>
                <span id="error-correo"></span>
              </div>
            </div>

            <div class="col-md-3">
              <div class="campo">
                <label for="tipo">Tipo de usuario *</label>
                <select id="tipo" name="tipo" onchange="validarTipo()">
                  <option value="">-- Seleccione el tipo --</option>
                </select>
                <span id="error-tipo"></span>
              </div>
            </div>

            <div class="col-md-3">
              <div class="campo">
                <label for="fecha">Fecha de nacimiento</label>
                <input type="date" id="fecha" name="fecha">
                <span class="ayuda">Opcional.</span>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="campo">
                <label for="region">Region *</label>
                <select id="region" name="region" onchange="cambiarComunas(); validarRegion();">
                  <option value="">-- Seleccione la region --</option>
                </select>
                <span id="error-region"></span>
              </div>
            </div>

            <div class="col-md-6">
              <div class="campo">
                <label for="comuna">Comuna *</label>
                <select id="comuna" name="comuna" onchange="validarComuna()">
                  <option value="">-- Seleccione la comuna --</option>
                </select>
                <span id="error-comuna"></span>
              </div>
            </div>
          </div>

          <div class="campo">
            <label for="direccion">Direccion *</label>
            <input type="text" id="direccion" name="direccion" maxlength="300"
                   onblur="validarDireccion()">
            <span id="error-direccion"></span>
          </div>

          <button class="boton" type="submit">Guardar</button>
          <a class="boton boton-gris" href="usuarios.html">Cancelar</a>

          <p id="aviso-formulario"></p>

        </form>
      </section>
    </main>

  </div>

  <script src="../js/productos.js"></script>
  <script src="../js/usuarios.js"></script>
  <script src="../js/regiones.js"></script>
  <script src="../js/validaciones.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
